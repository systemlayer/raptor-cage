[package]
name = "raptor-cage"
description = "Your machine, your games, your rules"
version = "1.0.8"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
procfs = "0.18.0"
rand = "0.10.3"
# The sole direct regex usage (the placeholder pattern in placeholder.rs) uses explicit ASCII
# ranges, so no regex Unicode features are needed.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.6"
tokio = { version = "1.53.2", features = ["full"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
